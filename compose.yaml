services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sherpa}
      POSTGRES_DB: ${POSTGRES_DB:-sherpa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create a private .env file first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m

volumes:
  postgres_data:
